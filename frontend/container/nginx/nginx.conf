server {
      listen 8080;
      listen [::]:8080;
      server_name localhost;

      # This server only serves the built UI; API requests go straight to the backend.
      # If a proxy is put in front of the API, its body limit must cover the largest
      # single upload request: MAX_CONTENT_LENGTH for small one-request uploads and
      # FILES_UPLOAD_MAX_CHUNK_BYTES (20 MiB) per chunk. Large files, including 2 GiB
      # Train Data Source uploads (ML_TRAINING_UPLOAD_MAX_BYTES), are always sent in
      # chunks or directly to S3, so they never need a 2 GiB request body here.
      client_max_body_size 100M;
      client_body_buffer_size 128k;  # Increase the buffer size for larger requests


      # Basic headers for static content
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-XSS-Protection "1; mode=block" always;

      location / {
            root /usr/share/nginx/html;
            index index.html;

            # Allow all methods for static content
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
                add_header 'Access-Control-Allow-Headers' '*';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            # Serve index.html for all routes (SPA fallback)
            try_files $uri $uri/ /index.html;
      }
}