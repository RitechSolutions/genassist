<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenAssist | Stay Connected</title>
    <meta name="description" content="GenAssist AI" />
    <meta name="author" content="Ritech Solutions" />
    <link rel="icon" href="favicon.ico" />
    <!-- Apply the persisted/system theme before first paint to avoid a flash of
         the wrong theme. Kept in sync with storageKey in context/ThemeProvider.tsx. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme = stored || "light";
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (theme === "dark" || (theme === "system" && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <!-- Animated logo splash. Inline so it paints before the JS bundle arrives.
         Shown/hidden from src/lib/bootSplash.ts. Pure CSS on purpose: SVG
         SMIL animations don't start until window "load" (after the JS bundle), so
         they'd lag behind. Loop timeline: 1.9s start, 1.8s period. -->
    <style>
      #app-splash {
        --gas-bg: #ffffff;
        --gas-ink: #18181b;
        --gas-ink-hi: #204bff;
        --gas-brand: #204bff;
        --gas-brand-hi: #93a8ff;
        position: fixed;
        inset: 0;
        z-index: 9990;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--gas-bg);
        opacity: 1;
        transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), visibility 0s;
      }
      html.dark #app-splash {
        --gas-bg: #09090b;
        --gas-ink: #fafafa;
        --gas-ink-hi: #8da2ff;
        --gas-brand-hi: #a8b8ff;
      }
      #app-splash[hidden] { display: none; }
      #app-splash.gas-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), visibility 0s 0.4s;
      }
      .gas-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .gas-out .gas-stage { transform: scale(1.03); }
      .gas-art { position: relative; }
      .gas-logo {
        position: relative;
        display: block;
        width: clamp(184px, 46vw, 252px);
        height: auto;
        overflow: visible;
      }
      .gas-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      /* SVG parts. Everything on the mark scales around its centre. */
      .gas-pulse, .gas-pop, .gas-ripple {
        transform-box: view-box;
        transform-origin: 10.691px 10.5px;
      }
      .gas-particle, .gas-l {
        transform-box: fill-box;
        transform-origin: center;
      }
      .gas-particle { opacity: 0; fill: var(--gas-brand); }
      .gas-particle:nth-child(even) { fill: var(--gas-brand-hi); }
      .gas-ripple {
        opacity: 0;
        fill: none;
        stroke: var(--gas-brand);
        stroke-width: 1.25px;
        vector-effect: non-scaling-stroke;
      }
      .gas-fill {
        opacity: 0;
        fill: var(--gas-brand);
        /* Same-colour hairline stroke hides the anti-aliased seam with the G. */
        stroke: var(--gas-brand);
        stroke-width: 0.35px;
        stroke-linejoin: round;
        transform-box: view-box;
        transform-origin: 10.691px 10.5px;
      }
      .gas-word { fill: var(--gas-ink); }
      .gas-band { stop-color: var(--gas-ink-hi); }

      /* Intro (once): particles converge on the screen centre -> square spins into
         the diamond -> its centre shrinks away to open the G -> the mark glides left
         to its place in the logo while the letters slide out from behind it. */
      .gas-play .gas-art { animation: gas-center 0.8s cubic-bezier(0.65, 0, 0.35, 1) 0.74s both; }
      .gas-play .gas-particle { animation: gas-converge 0.6s cubic-bezier(0.7, 0, 0.3, 1) both; }
      .gas-play .gas-particle:nth-child(2) { animation-delay: 0.03s; }
      .gas-play .gas-particle:nth-child(3) { animation-delay: 0.06s; }
      .gas-play .gas-particle:nth-child(4) { animation-delay: 0.09s; }
      .gas-play .gas-pop { animation: gas-pop 0.75s cubic-bezier(0.34, 1.42, 0.52, 1) 0.42s both; }
      .gas-play .gas-ripple-intro { animation: gas-ripple 0.95s cubic-bezier(0.2, 0.6, 0.3, 1) 0.52s forwards; }
      .gas-play .gas-fill { animation: gas-open 0.5s cubic-bezier(0.55, 0, 0.25, 1) 0.66s both; }
      .gas-play .gas-l { animation: gas-letter 0.7s cubic-bezier(0.16, 1, 0.3, 1) calc(0.9s + var(--i) * 45ms) both; }
      /* Loop: the G (unchanged shape) pulses and emits a ripple. */
      .gas-play .gas-pulse { animation: gas-pulse 1.8s 1.9s infinite; }
      .gas-play .gas-sheen { animation: gas-sheen 1.8s 1.9s infinite; }
      .gas-play .gas-ripple-loop { animation: gas-ripple-loop 1.8s linear 1.9s infinite; }

      /* The mark's centre is 10.69/120 of the logo width; this puts it mid-screen. */
      @keyframes gas-center {
        0% { transform: translateX(41.09%); }
        100% { transform: none; }
      }
      @keyframes gas-converge {
        0% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(-180deg) scale(0.4); }
        35% { opacity: 1; }
        78% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
        100% { opacity: 0; transform: translate(0, 0) rotate(0deg) scale(1.5); }
      }
      @keyframes gas-pop {
        0% { opacity: 0; transform: scale(0.25) rotate(-135deg); }
        18% { opacity: 1; }
        100% { opacity: 1; transform: scale(1) rotate(0deg); }
      }
      @keyframes gas-open {
        0% { opacity: 1; transform: scale(1) rotate(0deg); }
        100% { opacity: 0; transform: scale(0) rotate(90deg); }
      }
      @keyframes gas-sheen {
        0%, 52% { transform: translateX(0); animation-timing-function: cubic-bezier(0.45, 0, 0.3, 1); }
        100% { transform: translateX(160px); }
      }
      @keyframes gas-ripple {
        0% { opacity: 0.5; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.9); }
      }
      @keyframes gas-ripple-loop {
        0%, 49% { opacity: 0; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1); animation-timing-function: cubic-bezier(0.2, 0.6, 0.3, 1); }
        88%, 100% { opacity: 0; transform: scale(1.85); }
      }
      @keyframes gas-pulse {
        0%, 34% { transform: scale(1); animation-timing-function: cubic-bezier(0.6, 0, 0.4, 1); }
        46% { transform: scale(0.9); animation-timing-function: cubic-bezier(0.3, 0, 0.2, 1); }
        55% { transform: scale(1.07); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        72%, 100% { transform: scale(1); }
      }
      @keyframes gas-letter {
        0% { opacity: 0; transform: translateX(-7px); }
        100% { opacity: 1; transform: none; }
      }
      @keyframes gas-fade-in {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes gas-soft-pulse {
        0% { opacity: 0.35; }
        100% { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash *, #app-splash .gas-stage { animation: none !important; transition: none !important; }
        .gas-particle, .gas-ripple { display: none; }
        /* Still signal "loading" without movement: a gentle fade on the mark. */
        #app-splash .gas-pop { animation: gas-soft-pulse 1.4s ease-in-out infinite alternate !important; }
      }
    </style>
  </head>
